# FlySaaS Client Org Template - Fly.io Configuration
# This is a template - actual apps will be named: flysaas-{org-slug}

# app = 'flysaas-{ORG_SLUG}' # Set programmatically during provisioning
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  target = 'production'

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # ORG_ID = "{ORG_SLUG}" # Set programmatically
  DB_PATH = "/app/data/client.db"
  # SUPERORG_JWKS_URL = "https://flysaas-superorg.fly.dev/auth/jwks" # Set programmatically

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[mounts]]
  source = "client_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
