# FlySaaS SuperOrg - Fly.io Configuration

app = 'flysaas-superorg'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  target = 'production'

[env]
  PORT = "3000"
  NODE_ENV = "production"
  BASE_URL = "https://flysaas-superorg.fly.dev"
  JWKS_URL = "https://flysaas-superorg.fly.dev/auth/jwks"
  SUPERORG_JWKS_URL = "https://flysaas-superorg.fly.dev/auth/jwks"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Database configuration (Fly Postgres)
# Run: flyctl postgres create --name flysaas-postgres
# Then: flyctl postgres attach flysaas-postgres
